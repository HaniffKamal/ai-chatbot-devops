# ==============================================================================
# Docker Compose: Production Environment Overrides (Strict Rule 3.2)
# ==============================================================================
# Architecture Guardrails:
#   1. Registry Images: Pulls pre-built backend and frontend images from GHCR
#      (no on-host build, so the server never needs the source tree).
#   2. Cloud API Primary: Uses Groq Cloud API (openai/gpt-oss-20b) for sub-second
#      low latency on CPU-only AWS EC2 instances, saving ~5GB RAM and 100% CPU.
#   3. Lightweight Stack: Runs only FastAPI Backend and Nginx Frontend (no Ollama).
#   4. Resource Safeguards: Sets memory & CPU limits to prevent server starvation.
#   5. High Availability: unless-stopped restart policies on all containers.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# ==============================================================================

services:
  backend:
    image: ghcr.io/haniffkamal/chatbot:latest
    pull_policy: always
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M

  frontend:
    image: ghcr.io/haniffkamal/chatbot-frontend:latest
    pull_policy: always
    restart: unless-stopped
    # Loopback only: used by the Ansible /health gate. Public traffic arrives
    # through the Cloudflare Tunnel, and the Security Group has no ingress.
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Outbound-only connector to the Cloudflare edge (no inbound ports).
  # cloudflared.env is rendered by Ansible from an SSM SecureString.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: chatbot-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - cloudflared.env
    depends_on:
      - frontend
    networks:
      - chatbot-net
    # No HEALTHCHECK: the official image is distroless (no shell/curl).
    # Connector health is reported by Cloudflare Zero Trust and the
    # --metrics endpoint; restart policy handles crashes.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
