services:
  # -----------------------------------------------------------
  # LLM Engine: Ollama with Native NVIDIA GPU Pass-Through
  # -----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - chatbot-net

  # -----------------------------------------------------------
  # Backend API: FastAPI Asynchronous Microservice
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=llama3.1:8b
      - OLLAMA_TIMEOUT=60.0
    depends_on:
      - ollama
    networks:
      - chatbot-net

  # -----------------------------------------------------------
  # Reverse Proxy & Web Server: Nginx
  # -----------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: chatbot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - chatbot-net

volumes:
  ollama_data:
    name: chatbot_ollama_data

networks:
  chatbot-net:
    driver: bridge
