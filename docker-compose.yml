# ==============================================================================
# Docker Compose: Local Development & Microservice Stack
# ==============================================================================
# Services:
#   1. ollama:   Local LLM inference engine with native NVIDIA GPU pass-through
#   2. backend:  FastAPI async microservice communicating with Ollama
#   3. frontend: Nginx reverse proxy serving static HTML and routing /api/ requests
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. LLM Engine: Ollama
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    restart: unless-stopped          # Automatically restart on failure or reboot
    profiles:
      - local

    ports:
      - "11434:11434"                # Expose Ollama API to host for direct inspection

    volumes:
      # Persist downloaded LLM model weights (e.g. Llama 3.1 8B, 4.7GB)
      # Without this volume, models would be deleted every time the container stops!
      - ollama_data:/root/.ollama

    environment:
      # Keep model loaded in memory for 24 hours (prevents cold-start delays on subsequent requests)
      - OLLAMA_KEEP_ALIVE=24h

    networks:
      - chatbot-net                  # Join the shared internal bridge network


  # ----------------------------------------------------------------------------
  # 2. Backend API: FastAPI Microservice
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend             # Path to backend source code
      dockerfile: Dockerfile         # Uses multi-stage python:3.10-slim build
    container_name: chatbot-backend
    restart: unless-stopped

    ports:
      - "8000:8000"                  # Expose FastAPI API on port 8000

    # Load environment variables from .env file (if present)
    env_file:
      - .env

    # Fallback default values if .env file is missing or variables are unset
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}               # Default engine: ollama locally, groq in prod
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}     # Internal Docker DNS name for Ollama
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2:1b}         # Target model to query
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60.0}              # Timeout for LLM generation in seconds
      - GROQ_API_KEY=${GROQ_API_KEY:-}                     # Cloud Groq API key
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}      # Official fast cloud model
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://haniffkamal.my}

    volumes:
      # Mount application source code for live development
      - ./backend/app:/app/app:ro
      # Mount knowledge base markdown files (read-only for live updates)
      - ./backend/data:/app/data:ro
      # Mount operational and diagnostic utility scripts
      - ./scripts:/app/scripts:ro
      # Persist embedded ChromaDB vector storage
      - chroma_data:/app/chroma_db
      # Persist ONNX embedding model cache across container recreations
      - chroma_models:/home/appuser/.cache

    # Startup order: if Ollama is running (local profile), start it before backend
    depends_on:
      ollama:
        required: false

    networks:
      - chatbot-net


  # ----------------------------------------------------------------------------
  # 3. Web Server & Reverse Proxy: Nginx
  # ----------------------------------------------------------------------------
  frontend:
    image: nginx:alpine              # Lightweight Alpine Linux base image (~20MB)
    container_name: chatbot-frontend
    restart: unless-stopped

    ports:
      - "80:80"                      # Standard HTTP entrypoint for client browser

    volumes:
      # Mount Nginx reverse proxy configuration (read-only)
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount portfolio static assets (HTML, CSS, JS) (read-only)
      - ./frontend:/usr/share/nginx/html:ro

    # Ensure backend starts before Nginx forwards traffic
    depends_on:
      - backend

    networks:
      - chatbot-net


# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  # Managed Docker volume storing gigabytes of LLM model weights safely on disk
  ollama_data:
    name: chatbot_ollama_data

  # Persistent ChromaDB vector database storage
  chroma_data:
    name: chatbot_chroma_data

  # Persistent cache for downloaded ONNX embedding model weights
  chroma_models:
    name: chatbot_chroma_models


# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  # User-defined bridge network providing automatic internal DNS name resolution
  # (e.g. backend can ping 'http://ollama:11434' using service name as hostname)
  chatbot-net:
    driver: bridge
