# ==============================================================================
# Nginx Reverse Proxy & Security Hardened Gateway
# ==============================================================================
# Architecture & Security Guardrails:
#   1. Rate Limiting: 10 requests/minute per IP with a burst of 5 (HTTP 429).
#      Protects LLM compute from DDoS, scrapers, and API quota exhaustion.
#   2. Frame & Clickjacking Protection: CSP frame-ancestors restricts embedding
#      strictly to 'self' and the developer's master portfolio (https://haniffkamal.my).
#   3. MIME-Sniffing & Header Hardening: Prevents browser content-type sniffing.
#   4. Request Body Boundary: Caps /api/ body to 64k to prevent buffer exhaustion.
# ==============================================================================

# Rate limit zone: 10MB memory zone (~160,000 IPs), capped at 10 requests/minute
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Hide Nginx version banner from response headers
    server_tokens off;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow iframe embedding ONLY on localhost and master portfolio website
    add_header Content-Security-Policy "frame-ancestors 'self' https://haniffkamal.my;" always;

    # --------------------------------------------------------------------------
    # Static Assets (Chatbot Web UI)
    # --------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Backend API Reverse Proxy (Rate Limited & Protected)
    # --------------------------------------------------------------------------
    location /api/ {
        # Enforce rate limit on API calls (burst of 5 with no artificial delay)
        limit_req zone=chat_limit burst=5 nodelay;

        # Cap request body size to 64KB (prevent buffer overflow/memory exhaustion)
        client_max_body_size 64k;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous read timeout for local LLM inference on CPU/GPU
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # Health Check (Unthrottled for Docker & Cloud Monitoring)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
