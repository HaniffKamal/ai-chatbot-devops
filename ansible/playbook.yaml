# ==============================================================================
# Ansible Production Playbook: AI Chatbot Host Configuration
# ==============================================================================
# Target: AWS EC2 Instance (m7i-flex.large, Ubuntu 26.04 LTS)
# Connection: SSH tunneled over AWS SSM Session Manager (Rule 1.2: Zero Port 22)
# Idempotency: All tasks declare desired state; re-running produces changed=0.
# Docker is installed by the pinned Galaxy role (see README for install commands).
# ==============================================================================

- name: Configure AI Chatbot Production Host
  hosts: chatbot
  become: true
  gather_facts: true

  vars:
    app_directory: "/opt/chatbot"

  tasks:
    # --------------------------------------------------------------------------
    # 1. Base Utilities
    # --------------------------------------------------------------------------
    - name: Install base utilities
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - curl
          - git
          - htop
        state: present

    # --------------------------------------------------------------------------
    # 2. Docker Engine + Compose plugin (geerlingguy.docker v8.0.1)
    #    The role owns the apt repo, packages, service, compose plugin,
    #    docker group membership, and handler-driven restarts.
    # --------------------------------------------------------------------------
    - name: Install Docker Engine and Compose plugin
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_users:
          - ubuntu

    # --------------------------------------------------------------------------
    # 3. Application Directory Setup
    # --------------------------------------------------------------------------
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ app_directory }}"
        - "{{ app_directory }}/logs"

    # --------------------------------------------------------------------------
    # 4. Verification
    # --------------------------------------------------------------------------
    - name: Query Docker and Compose versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      register: docker_versions
      changed_when: false

    - name: Display installed engine versions
      ansible.builtin.debug:
        msg: "{{ docker_versions.results | map(attribute='stdout') | list }}"
