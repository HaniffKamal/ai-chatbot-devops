# ==============================================================================
# Ansible Configuration: SSH Tunneling over AWS Systems Manager (SSM)
# ==============================================================================
# Architectural Guardrail: Rule 1.2 (Zero Open Inbound Administrative Ports)
# Port 22 is completely closed in the AWS Security Group.
# Ansible connects through AWS SSM Session Manager WebSocket proxy tunnel.
# ==============================================================================

[defaults]
inventory = inventory.ini
host_key_checking = False
remote_user = ubuntu
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ap-southeast-1"
