# ==============================================================================
# Ansible Continuous Deployment Playbook: AI Chatbot Production
# ==============================================================================
# Target: AWS EC2 Instance (m7i-flex.large, Ubuntu 26.04 LTS)
# Connection: SSH tunneled over AWS SSM Session Manager (Rule 1.2: Zero Port 22)
# Speed: Fast application release (3-10 seconds, zero apt package overhead)
# Idempotency: All tasks declare desired state; re-running produces changed=0.
# ==============================================================================

- name: Deploy AI Chatbot to Production (AWS EC2)
  hosts: chatbot
  remote_user: ubuntu
  gather_facts: false

  vars:
    app_directory: "/opt/chatbot"
    aws_region: "ap-southeast-1"
    # Must match var.environment in terraform/variables.tf
    tunnel_token_ssm_parameter: "/chatbot/dev/cloudflare_tunnel_token"

  tasks:
    # --------------------------------------------------------------------------
    # 1. Environment Secrets Resolution (Local Controller)
    # --------------------------------------------------------------------------
    - name: Read GROQ_API_KEY directly from local .env
      ansible.builtin.set_fact:
        groq_api_key: "{{ lookup('ansible.builtin.file', '../.env') | regex_search('GROQ_API_KEY=([^\r\n]+)', '\\1') | first }}"
      run_once: true
      no_log: true

    - name: Validate that GROQ_API_KEY is present
      ansible.builtin.assert:
        that:
          - groq_api_key is defined
          - groq_api_key | length > 10
        fail_msg: "GROQ_API_KEY is missing from your local .env file! Please check /home/invader/chatbot/.env"
      no_log: true

    - name: Read Cloudflare Tunnel token from SSM Parameter Store
      ansible.builtin.set_fact:
        cloudflare_tunnel_token: "{{ lookup('pipe', 'aws ssm get-parameter --name ' ~ tunnel_token_ssm_parameter ~ ' --with-decryption --query Parameter.Value --output text --region ' ~ aws_region) }}"
      run_once: true
      no_log: true

    - name: Validate that the tunnel token is present
      ansible.builtin.assert:
        that:
          - cloudflare_tunnel_token is defined
          - cloudflare_tunnel_token | length > 20
        fail_msg: "Tunnel token missing from SSM at {{ tunnel_token_ssm_parameter }}"
      no_log: true


    # --------------------------------------------------------------------------
    # 2. File Synchronization & Configuration
    # --------------------------------------------------------------------------
    - name: Deploy Docker Compose specification files
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ app_directory }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      loop:
        - docker-compose.yaml
        - docker-compose.prod.yaml

    - name: Render production .env from Jinja2 template (Strict 0600 permissions)
      ansible.builtin.template:
        src: "templates/.env.j2"
        dest: "{{ app_directory }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Render Cloudflare Tunnel connector env file (Strict 0600 permissions)
      ansible.builtin.template:
        src: "templates/cloudflared.env.j2"
        dest: "{{ app_directory }}/cloudflared.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    # --------------------------------------------------------------------------
    # 3. Container Orchestration & Rollout (Native Docker Compose v2)
    # --------------------------------------------------------------------------
    - name: Start or update production containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        files:
          - docker-compose.yaml
          - docker-compose.prod.yaml
        state: present
        pull: policy
        remove_orphans: true

    # --------------------------------------------------------------------------
    # 4. Automated Post-Deployment Verification Gate
    # --------------------------------------------------------------------------
    - name: Wait for Nginx and FastAPI services to report healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

    - name: Display live service verification details
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "🚀 DEPLOYMENT COMPLETED SUCCESSFULLY!"
          - "===================================================="
          - "Service Status:     {{ health_check.json.status }}"
          - "Active Provider:    {{ health_check.json.active_provider }}"
          - "Configured Model:   {{ health_check.json.configured_model }}"
          - "Groq Connected:     {{ health_check.json.groq_connected }}"
          - "RAG Indexed Chunks: {{ health_check.json.rag_indexed_chunks }}"
          - "===================================================="
