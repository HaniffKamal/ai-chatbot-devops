# ==============================================================================
# Ansible Production Playbook: AI Chatbot Host Configuration
# ==============================================================================
# Target: AWS EC2 Instance (m7i-flex.large, Ubuntu 24.04 LTS)
# Connection: SSH tunneled over AWS SSM Session Manager (Rule 1.2: Zero Port 22)
# Idempotency: All tasks declare desired state; re-running produces changed=0.
# ==============================================================================

- name: Configure AI Chatbot Production Host
  hosts: chatbot
  become: true
  gather_facts: true

  vars:
    app_directory: "/opt/chatbot"
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    # --------------------------------------------------------------------------
    # 1. System Package Maintenance & Base Utilities
    # --------------------------------------------------------------------------
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essential system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - htop
        state: present

    # --------------------------------------------------------------------------
    # 2. Docker Official Repository & Engine Installation
    # --------------------------------------------------------------------------
    - name: Create directory for Docker apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download official Docker GPG signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure official Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # --------------------------------------------------------------------------
    # 3. Application Directory Setup
    # --------------------------------------------------------------------------
    - name: Create application deployment directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Create application logs directory
      ansible.builtin.file:
        path: "{{ app_directory }}/logs"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # --------------------------------------------------------------------------
    # 4. Verification & Telemetry
    # --------------------------------------------------------------------------
    - name: Verify Docker version
      ansible.builtin.command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Verify Docker Compose version
      ansible.builtin.command: docker compose version
      register: compose_version_output
      changed_when: false

    - name: Display installed engine versions
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "{{ docker_version_output.stdout }}"
          - "{{ compose_version_output.stdout }}"
