# ==============================================================================
# CI: Terraform static checks (read-only — never plans or applies)
# ==============================================================================
# Runs only when terraform/ changes. No AWS credentials are used: `fmt` and
# `validate` work offline and catch syntax/formatting drift before review.
# Apply stays manual (RULE 2.2: plan and review before apply).
# ==============================================================================

name: Terraform Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Check formatting (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Initialize without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate
