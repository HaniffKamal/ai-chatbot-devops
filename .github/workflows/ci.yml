name: CI/CD Pipeline - AI Chatbot Platform

# ==============================================================================
# GitHub Actions CI/CD Pipeline
# ==============================================================================
# Architecture & DevOps Guardrails:
#   1. Quality Gate: Runs full automated pytest suite before any image build.
#   2. Zero Manual Secrets: Uses native GITHUB_TOKEN to authenticate with GHCR.
#   3. GitHub Container Registry (GHCR): Builds multi-stage slim image in cloud runners.
#   4. Dual Tagging: Tags both :latest and :<commit-sha> for release traceability.
#   5. High-Speed Layer Caching: Utilizes GitHub Actions cache (type=gha) to accelerate builds.
# ==============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"

# Minimum permissions needed for GHCR push (Principle of Least Privilege)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbot

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Automated Testing & Verification Gate
  # ----------------------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute pytest test suite
        run: |
          pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Docker Image to GHCR (Phase 4 Milestone)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
