name: CI/CD Pipeline - AI Chatbot Platform

# ==============================================================================
# GitHub Actions CI/CD Pipeline
# ==============================================================================
# Architecture & DevOps Guardrails:
#   1. Quality Gate: Always runs automated pytest suite on any repository change.
#   2. Smart Path Filtering: Detects file changes using dorny/paths-filter@v4 (Node 24).
#      Only triggers container builds when 'backend/**' files are modified.
#   3. Zero Manual Secrets: Uses native GITHUB_TOKEN to authenticate with GHCR.
#   4. Dual Tagging: Tags both :latest and :<commit-sha> for release traceability.
#   5. High-Speed Layer Caching: Utilizes GitHub Actions cache (type=gha) to accelerate builds.
# ==============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yaml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yaml"

# Minimum permissions needed for GHCR push (Principle of Least Privilege)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatbot

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Detect File Changes (Smart Path Filtering)
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for backend modifications
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'

  # ----------------------------------------------------------------------------
  # Job 2: Automated Testing & Verification Gate (Always Runs on Code Changes)
  # ----------------------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute pytest test suite
        run: |
          pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Docker Image to GHCR (Selective Execution)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image to GHCR
    needs: [test, changes]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
